<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <title>Risk Blitz Simulator Pro</title>

</head>
<body>
    <div class="container">
        <h1>⚔️ Risk Blitz Simulator Pro</h1>
        <p class="subtitle">شبیه‌ساز پیشرفته نبردهای Risk با احتمال دقیق و زنده</p>

        <div class="input-section">
            <div class="input-grid">
                <div class="input-group">
                    <label for="attackerTroops">Attacker Troops</label>
                    <input type="number" id="attackerTroops" value="10" min="2" max="1000">
                </div>
                <div class="input-group">
                    <label for="defenderTroops">Defender Troops</label>
                    <input type="number" id="defenderTroops" value="6" min="1" max="1000">
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="simulateBattle()">Simulate Battle</button>
                <button class="btn btn-secondary" onclick="rollOneRound()">Roll One Round</button>
                <button class="btn btn-blitz" onclick="blitzMode()">⚡ BLITZ</button>
                <button class="btn btn-reset" onclick="resetAll()">Reset</button>
            </div>
        </div>

        <!-- Live probability section -->
        <div class="live-probability" id="liveProbabilitySection" style="display: none;">
            <h3 style="margin-bottom: 10px;">📊 Live Win Probability</h3>
            <div class="probability-bar">
                <div class="probability-attacker" id="liveAttackerProb" style="width: 50%;">50%</div>
                <div class="probability-defender" id="liveDefenderProb" style="width: 50%;">50%</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Expected Attacker Losses</div>
                    <div class="stat-value" id="liveAttackerLosses">-</div>
                </div>
            </div>
        </div>

        <div class="result-section" id="resultSection" style="display: none;">
            <div id="resultContent"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
