<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <title>شبیه‌ساز حرفه‌ای نبرد ریسک</title>
</head>
<body>

    <!-- دکمه بازگشت به بالا -->
    <button class="scroll-top-btn" id="scrollTopBtn" onclick="scrollToTop()">↑</button>

    <div class="container">
        
        <div class="live-probability" id="liveProbabilitySection" style="display: none;">
            <div class="probability-bar">
                <div class="probability-attacker" id="liveAttackerProb" style="width: 50%;">۵۰٪</div>
                <div class="probability-defender" id="liveDefenderProb" style="width: 50%;">۵۰٪</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card" style="margin-bottom:1rem ;">
                    <div class="stat-label">تلفات مورد انتظار مهاجم</div>
                    <div class="stat-value" id="liveAttackerLosses">-</div>
                </div>
            </div>
            <div class="input-grid" >
                <div class="input-group">
                    <input type="number" placeholder="حمله کننده" id="attackerTroops" value="10" min="2" max="1000">
                </div>
                <div class="input-group">
                    <input type="number" id="defenderTroops" placeholder="دفاع کننده" value="6" min="1" max="1000">
                </div>
            </div>
    
            <div class="button-group">
                <button class="btn btn-primary" id="simulateBtn" onclick="simulateBattle()">شبیه‌سازی نبرد</button>
                <button class="btn btn-reset" onclick="resetAll()">بازنشانی</button>
            </div>
        </div>

        <div class="result-section" id="resultSection" style="display: none;">
            <div id="resultContent"></div>
        </div>
    </div>

    <script src="main.js"></script>
    <script>
        // ============ اسکرول به پایین بعد از شبیه‌سازی ============
        const originalSimulate = window.simulateBattle;

        window.simulateBattle = function() {
            // اجرای تابع اصلی
            if (typeof originalSimulate === 'function') {
                originalSimulate();
            }

            // اسکرول به بخش نتیجه بعد از اجرا (با تاخیر برای اطمینان از رندر شدن)
            setTimeout(() => {
                const resultSection = document.getElementById('resultSection');
                if (resultSection && resultSection.style.display !== 'none') {
                    resultSection.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start',
                        inline: 'nearest'
                    });
                }
            }, 100);
        };

        // ============ دکمه بازگشت به بالا ============
        const scrollTopBtn = document.getElementById('scrollTopBtn');

        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
        });

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // ============ همچنین برای دکمه Blitz Mode ============
        const originalBlitz = window.blitzMode;
        if (typeof originalBlitz === 'function') {
            window.blitzMode = function() {
                originalBlitz();
                setTimeout(() => {
                    const resultSection = document.getElementById('resultSection');
                    if (resultSection && resultSection.style.display !== 'none') {
                        resultSection.scrollIntoView({ 
                            behavior: 'smooth', 
                            block: 'start'
                        });
                    }
                }, 100);
            };
        }
    </script>
</body>
</html>
